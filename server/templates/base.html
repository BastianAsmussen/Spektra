<!DOCTYPE html>
<html lang="da" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Spektra{% endblock %}</title>
    <link rel="stylesheet" href="{{ "/static/app.css"|v }}">
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("spektra-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch { }
      })();
    </script>
    <script src="{{ "/static/htmx.js"|v }}" defer></script>
    <script src="{{ "/static/htmx-ext-ws.js"|v }}" defer></script>
    <script src="{{ "/static/chrome.js"|v }}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body class="flex h-full flex-col bg-canvas text-text"{% block body_attrs %}{% endblock %}>
    {% block chrome %}{% endblock %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
