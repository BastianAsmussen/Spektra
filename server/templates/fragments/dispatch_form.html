{%- import "fragments/icons.html" as icon -%}

<form class="mt-2 grid gap-2 rounded border border-surface0 bg-canvas p-3"
  hx-post="/fragments/alarms/{{ alarm_id }}/dispatch"
  hx-target="#alarm-{{ alarm_id }}" hx-swap="outerHTML">
  <label class="grid gap-1 text-xs text-subtext0">
    Tekniker
    <select name="technician_user_id" required
      class="rounded border border-surface0 bg-mantle px-2 py-1 text-xs text-text">
      {% for technician in technicians %}
        <option value="{{ technician.id }}">{{ technician.name }}</option>
      {% else %}
        <option value="" disabled>Ingen teknikere oprettet</option>
      {% endfor %}
    </select>
  </label>

  <label class="grid gap-1 text-xs text-subtext0">
    Station
    <input type="text" name="station_name" required maxlength="100"
      value="{{ station_name }}"
      class="rounded border border-surface0 bg-mantle px-2 py-1 text-xs text-text">
  </label>

  <button type="submit"
    class="flex w-fit items-center gap-1.5 rounded border border-surface0 bg-surface0 px-2 py-1
      text-xs text-text transition hover:border-blue hover:text-blue">
    {% call icon::send("h-3.5 w-3.5") %}{% endcall %}Send
  </button>
</form>
