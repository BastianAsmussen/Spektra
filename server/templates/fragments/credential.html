{%- import "fragments/icons.html" as icon -%}

<div class="grid gap-3 rounded-md border border-yellow bg-canvas p-4">
  <div>
    <h3 class="text-sm font-semibold text-text">Tilmeldingsnøgle for {{ node_name }}</h3>
    <p class="mt-1 text-xs text-subtext0">
      Vises kun denne ene gang. Noteres nu og indsættes i nodens konfiguration
      som <code class="text-text">enrollment_token</code>. Er den mistet, udstedes
      en ny.
    </p>
  </div>

  <code class="block overflow-x-auto rounded border border-surface0 bg-mantle px-3 py-2
    font-mono text-xs text-text">{{ credential }}</code>

  <p class="font-mono text-xs text-overlay0">node #{{ node_id }}</p>
</div>
